<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Cyber Futuristic Design</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }
        p {
            font-size: 24px;
            margin: 10px 0;
        }
        .button {
            padding: 10px 20px;
            background-color: #00c6ff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0072ff;
        }
    </style>
</head>
<body>
    <div>
        <h1>Welcome to the Futuristic World</h1>
        <p>Your journey into the future begins here.</p>
        <button class="button">Explore</button>
    </div>
</body>
</html>
